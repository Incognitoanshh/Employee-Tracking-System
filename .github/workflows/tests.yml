name: Tests

# EVERY TEST, ON EVERY PUSH — and the build waits for them.
#
# This did not exist. There were nearly a thousand checks in the repository
# and nothing ran them: the only workflow built installers. So a change could
# break something with a test already written for it and still produce a green
# tick and a downloadable Setup.exe.
#
# That is how a broken force-logout and a wrong Online dot both reached a
# build. Not because nobody had thought about them — because the thinking sat
# in files no machine ever opened.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # Called as a gate by build.yml.
  workflow_call:

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest

    services:
      postgres:
        # The tests create and drop their own databases, one per run, so they
        # need a server they are allowed to own — not a managed database.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The suites shell out to psql for setup and for reading rows back —
      # deliberately, so a check reads the database rather than trusting the
      # API it is testing.
      - name: Install the psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Install dependencies
        working-directory: server
        run: npm ci || npm install

      - name: Run every server suite
        run: |
          failed=0
          total=0
          for t in server/tests/test_*.js; do
            echo "── $(basename "$t")"
            # A BOUND, so a hang is a failure instead of a six-hour bill.
            #
            # That is not hypothetical: a deadlock between a test's queries
            # and a migration running in the background took one job to the
            # six-hour limit and printed nothing at all — no failure, no
            # output, just the name of the test it had reached. Two minutes
            # is generous; the whole suite runs in about that.
            if timeout 120 node "$t" > /tmp/out.txt 2>&1; then
              total=$((total + $(grep -c PASS /tmp/out.txt || true)))
            else
              failed=$((failed + 1))
              echo "FAILED: $t"
              grep -E "FAIL" /tmp/out.txt | head -20
              tail -20 /tmp/out.txt
            fi
          done
          echo "─────────────────────────────"
          echo "$total checks passed, $failed suite(s) failed"
          test "$failed" -eq 0

      - name: Check the migration script itself
        run: |
          # It ships as an instruction to run on production, so it is run
          # here first — against the real migrations, in a directory whose
          # name contains a space. That is not decoration: the first version
          # of this script split every path on whitespace and produced 45
          # failures on the live server, none of which was a real migration
          # error, because the application directory is called
          # "Employee-Tracking-System-main copy".
          bash server/tests/test_migrate_sh.sh

      - name: Refuse a known-vulnerable dependency
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

  client:
    name: Client
    runs-on: ubuntu-latest

    # The screenshot pipeline test starts the real server against a real
    # database and drives the real client through it, so this job needs
    # Postgres too — it is the only client suite that does.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      # No display on a runner. Qt draws into memory instead, which is enough
      # for everything these check — geometry, text, and which widgets exist.
      QT_QPA_PLATFORM: offscreen
      # The client refuses to start without this, on purpose: without a fixed
      # key, screenshots taken before a reinstall cannot be decrypted after
      # one. A throwaway value here, obviously — the real key lives on the
      # VPS and in nobody's repository.
      #
      # BASE64 of 32 zero bytes, not hex. The client base64-decodes this one
      # while the server's ENCRYPTION_KEY is hex — two different encodings for
      # two different keys, which is worth knowing before pasting one into the
      # wrong file.
      SCREENSHOT_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Qt draws offscreen, but pyautogui — which screenshot_manager imports
      # at module load — reads DISPLAY on Linux and raises KeyError without
      # one. So a virtual display is needed as well, not instead: xvfb for
      # pyautogui, offscreen for Qt.
      - name: Install the libraries Qt needs, and a virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            xvfb scrot python3-tk python3-dev \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0

      # From requirements.txt, not a hand-written list. The first run of this
      # workflow failed because I listed the packages by hand and left out
      # cryptography and pyautogui — the file that already names every one of
      # them was sitting in the repository.
      #
      # pyobjc is macOS-only and does not build on Linux; the Windows build
      # step strips it the same way.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          grep -viE "^(pyobjc|appscript)" requirements.txt > req_ci.txt
          pip install -r req_ci.txt

      - name: Install the server, and psql
        run: |
          sudo apt-get install -y -qq postgresql-client
          cd server && (npm ci || npm install)

      - name: Run every client suite
        run: |
          failed=0
          total=0
          for t in tests/test_*.py; do
            echo "── $(basename "$t")"
            if xvfb-run -a python3 -u "$t" > /tmp/out.txt 2>&1; then
              total=$((total + $(grep -c PASS /tmp/out.txt || true)))
            else
              failed=$((failed + 1))
              echo "FAILED: $t"
              grep -E "FAIL" /tmp/out.txt | head -20
              tail -20 /tmp/out.txt
            fi
          done
          echo "─────────────────────────────"
          echo "$total checks passed, $failed suite(s) failed"
          test "$failed" -eq 0
