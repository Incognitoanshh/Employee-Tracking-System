name: Build Cross-Platform Desktop Apps

# Shown against each run in the Actions list. "test 3" — the round after the
# forced-logout, macOS notification and Screen Recording fixes found during
# live testing of test 2. Still no tag, so the release job below does not run
# and nothing is published.
run-name: test 3

on:
  push:
    branches: [ main ]
    # A version tag builds and publishes. Without this the release job below
    # could never run, because nothing would start the workflow.
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  # Rebuild on demand, without inventing a commit to trigger one.
  # Needed whenever the installers have to be regenerated but the code has
  # not changed — artifacts expire, and a run's artifacts stopped being
  # reachable once the repository was made private.
  #   gh workflow run "Build Cross-Platform Desktop Apps" --ref main
  workflow_dispatch:

jobs:
  # THE GATE. Nothing is built until every test has passed.
  #
  # Without this the build was happy to produce an installer from code that
  # broke checks already written for it — which is exactly how a broken force
  # logout and a wrong Online dot both reached a downloadable Setup.exe.
  tests:
    uses: ./.github/workflows/tests.yml

  build-windows:
    needs: tests
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 python-dotenv pyinstaller
          if exist requirements.txt (
            echo Cleaning requirements.txt for Windows...
            findstr /V /I "pyobjc" requirements.txt > req_win.txt
            pip install -r req_win.txt
          )

      - name: Create client .env file
        run: |
          echo APP_NAME=Amaze Connect > client\.env
          echo SCREENSHOT_MIN_INTERVAL=300 >> client\.env
          echo SCREENSHOT_MAX_INTERVAL=600 >> client\.env
          echo IDLE_THRESHOLD=60 >> client\.env
          echo API_BASE_URL=http://65.21.212.85:8000/api >> client\.env
          echo SCREENSHOT_ENCRYPTION_KEY=${{ secrets.SCREENSHOT_ENCRYPTION_KEY }} >> client\.env

      - name: Build Windows EXE
        run: |
          # Back to --onedir? No: reverted to --onefile on request.
          #
          # onefile extracts the ~62MB bundle to %TEMP% on every launch,
          # which is why startup was slow. onedir avoided that, but the
          # folder layout is a bigger change to how the app is distributed.
          #
          # --noupx: PyInstaller uses UPX to compress the binary when UPX
          # is on PATH. UPX-packed executables are one of the strongest
          # signals AV heuristics look for, because real malware uses the
          # same packer to hide its payload. Disabling it costs a few MB
          # and removes one concrete reason to flag us.
          #
          # NOTE: this reduces the false-positive rate but does not fix it.
          # An unsigned binary that screenshots the desktop and installs
          # itself at startup will keep tripping heuristics. The only real
          # fix is a code-signing certificate — see DEPLOYMENT.md.
          rem --onedir, NOT --onefile.
          rem
          rem onefile packs everything into one executable and extracts the
          rem lot — 62 MB of it — into a FRESH %TEMP% directory on every
          rem single launch. Defender then rescans all of it, because a new
          rem directory looks like new files, and while that happens the GIL
          rem is held and Windows paints the window as "Not Responding". The
          rem investigation is written up in client/main.py.
          rem
          rem The Mac build was moved to onedir for exactly this reason and
          rem the Windows one was left behind. With onedir the files live at
          rem a fixed install path, so Defender scans them once — at install
          rem — and never again.
          rem
          rem --noupx: PyInstaller compresses with UPX when it is on PATH.
          rem UPX-packed executables are one of the strongest signals AV
          rem heuristics look for, because real malware uses the same packer.
          pyinstaller --onedir --windowed --noupx --add-data "client/.env;." --add-data "assets;assets" --icon="assets/icon.ico" --name="Amaze Connect" client/main.py

      - name: Verify Windows build output
        shell: bash
        run: |
          # Catch a silently misplaced build here rather than after someone
          # downloads an empty artifact.
          test -f "dist/Amaze Connect/Amaze Connect.exe" || {
            echo "exe not found"; ls -R dist | head -40; exit 1; }
          echo "OK: dist/Amaze Connect/Amaze Connect.exe"
          du -sh "dist/Amaze Connect"

      - name: Build the installer
        shell: bash
        run: |
          # Inno Setup — free, and already installed on the GitHub Windows
          # runner. It turns the onedir folder into one Setup.exe that
          # installs to Program Files, adds a Start Menu entry, and
          # uninstalls cleanly: what somebody handing this to a company is
          # expected to provide, rather than a loose executable to copy.
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in v*|"") VERSION="0.0.0";; esac
          cat > installer.iss <<EOF
          [Setup]
          AppName=Amaze Connect
          AppVersion=$VERSION
          AppPublisher=Amaze Internet Services Pvt. Ltd.
          DefaultDirName={autopf}\\Amaze Connect
          DefaultGroupName=Amaze Connect
          UninstallDisplayIcon={app}\\Amaze Connect.exe
          OutputDir=installer_out
          OutputBaseFilename=Amaze-Connect-Setup
          Compression=lzma2
          SolidCompression=yes
          ; Per-user by default so no admin prompt is needed to install.
          PrivilegesRequired=lowest
          ArchitecturesInstallIn64BitMode=x64compatible

          [Files]
          Source: "dist\\Amaze Connect\\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs ignoreversion

          [Icons]
          Name: "{group}\\Amaze Connect"; Filename: "{app}\\Amaze Connect.exe"
          Name: "{userdesktop}\\Amaze Connect"; Filename: "{app}\\Amaze Connect.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional shortcuts:"

          [Registry]
          ; The app registers itself to start at login (StartupManager). The
          ; uninstaller has to take that entry away again, or Windows goes on
          ; trying to launch a deleted executable at every login for as long
          ; as the machine lives. ValueType none creates nothing at install —
          ; this line exists only for the uninstall side.
          Root: HKCU; Subkey: "Software\\Microsoft\\Windows\\CurrentVersion\\Run"; ValueType: none; ValueName: "ETS"; Flags: uninsdeletevalue

          [Run]
          Filename: "{app}\\Amaze Connect.exe"; Description: "Start Amaze Connect"; Flags: nowait postinstall skipifsilent
          EOF
          # Inno Setup ships on the GitHub Windows image, but the path has
          # moved between image versions and a hard-coded one fails the build
          # for a reason that has nothing to do with the code. Look for it,
          # and install it if this image does not have it.
          ISCC=""
          for candidate in \
            "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            "/c/Program Files/Inno Setup 6/ISCC.exe"; do
            [ -f "$candidate" ] && ISCC="$candidate" && break
          done
          if [ -z "$ISCC" ]; then
            echo "Inno Setup not on this image — installing"
            choco install innosetup -y --no-progress
            ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          fi
          echo "using $ISCC"
          "$ISCC" installer.iss
          ls -lh installer_out

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: test-2-Windows-Installer
          path: installer_out/Amaze-Connect-Setup.exe

  build-mac:
    needs: tests
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Mac System Tools & Dependencies
        run: |
          brew install create-dmg
          python -m pip install --upgrade pip
          pip install PySide6 python-dotenv pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Create client .env file
        run: |
          echo "APP_NAME=Amaze Connect" > client/.env
          echo "SCREENSHOT_MIN_INTERVAL=300" >> client/.env
          echo "SCREENSHOT_MAX_INTERVAL=600" >> client/.env
          echo "IDLE_THRESHOLD=60" >> client/.env
          echo "API_BASE_URL=http://65.21.212.85:8000/api" >> client/.env
          echo "SCREENSHOT_ENCRYPTION_KEY=${{ secrets.SCREENSHOT_ENCRYPTION_KEY }}" >> client/.env

      - name: Build Mac Executable
        run: |
          # --onedir (onefile nahi): onefile har launch pe poora 62MB bundle
          # temp folder me extract karta hai — isi wajah se app khulne me
          # kai second lagte the aur user ko 3-4 baar click karna padta tha.
          # onedir me libraries seedha .app/Contents/ me rehti hain, koi
          # extraction nahi. DMG me waise bhi .app hi jaata hai, is liye
          # distribution bilkul same rehta hai.
          pyinstaller --onedir --windowed --add-data "client/.env:." --add-data "assets:assets" --icon="assets/icon.icns" --name="Amaze Connect" client/main.py

      - name: Create DMG Installer
        run: |
          mkdir dmg_out
          create-dmg \
            --volname "Amaze Connect" \
            --volicon "assets/icon.icns" \
            --window-size 500 300 \
            --icon-size 100 \
            --icon "Amaze Connect.app" 130 120 \
            --app-drop-link 350 120 \
            "dmg_out/Amaze-Connect.dmg" \
            "dist/Amaze Connect.app"

      - name: Upload Mac DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-2-Mac-DMG
          path: dmg_out/Amaze-Connect.dmg

  # ── the release ────────────────────────────────────────────────────────
  #  Runs only for a v* tag.
  #
  #  Until now the installers existed solely as workflow artifacts, which
  #  expire — so the download links on a release older than a few weeks were
  #  dead, and the last release had to be assembled by hand: download both
  #  artifacts, then upload them again to the release page. This does that
  #  part, so a tag is all it takes.
  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download the installers
        uses: actions/download-artifact@v4
        with:
          path: installers

      - name: Name them after the version
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release
          # A file called "Setup.exe" on a release page tells nobody which
          # build it is. Somebody reporting a bug should be able to say so
          # from the filename alone.
          cp "installers/test-2-Windows-Installer/Amaze-Connect-Setup.exe" \
             "release/Amaze-Connect-${VERSION}-Windows-Setup.exe"
          cp "installers/test-2-Mac-DMG/Amaze-Connect.dmg" \
             "release/Amaze-Connect-${VERSION}-macOS.dmg"
          ls -lh release

      - name: Check the version in the tag matches the one in the code
        run: |
          set -e
          TAG="${GITHUB_REF_NAME#v}"
          CODE="$(grep -oE 'APP_VERSION = "[^"]+"' client/core/config/__init__.py | cut -d'"' -f2)"
          # Shipping a build that reports a different version from the one it
          # was released under makes every support conversation start with a
          # wrong answer.
          if [ "$TAG" != "$CODE" ]; then
            echo "Tag says $TAG, the client reports $CODE."
            echo "Update APP_VERSION in client/core/config/__init__.py, or retag."
            exit 1
          fi
          echo "Both say $TAG."

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
