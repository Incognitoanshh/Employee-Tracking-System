name: Build Cross-Platform Desktop Apps

# Shown against each run in the Actions list. "test 7" — the client is
# byte-identical to test 6; everything fixed since then was server-side
# (logout matching on the token, the migration script, the HTTPS setup) and
# is already deployed. This build exists to carry the label into the final
# round of testing. Still no tag, so the release job below does not run and
# nothing is published.
run-name: v1.0.1
# THE ARTIFACT NAMES NO LONGER CARRY A LABEL, deliberately.
#
# They used to ("test-5-Windows-Installer"), and twice a run was renamed
# while they were not — so a run called "test 6" held two files called
# "test-5-…", which is the one thing anybody looks at to know which build
# they are installing. It caused an argument about whether a build was the
# new one, and then happened again.
#
# Two names for one thing, kept in step by remembering. Now there is one:
# run-name says which build this is, the artifacts are just "Windows-Installer"
# and "Mac-DMG", and the RELEASE job renames the files after the tag —
# Amaze-Connect-1.0.0-Windows-Setup.exe — which is the name that reaches
# anybody outside this repository.

on:
  push:
    branches: [ main ]
    # A version tag builds and publishes. Without this the release job below
    # could never run, because nothing would start the workflow.
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  # Rebuild on demand, without inventing a commit to trigger one.
  # Needed whenever the installers have to be regenerated but the code has
  # not changed — artifacts expire, and a run's artifacts stopped being
  # reachable once the repository was made private.
  #   gh workflow run "Build Cross-Platform Desktop Apps" --ref main
  workflow_dispatch:

jobs:
  # THE GATE. Nothing is built until every test has passed.
  #
  # Without this the build was happy to produce an installer from code that
  # broke checks already written for it — which is exactly how a broken force
  # logout and a wrong Online dot both reached a downloadable Setup.exe.
  tests:
    uses: ./.github/workflows/tests.yml

  build-windows:
    needs: tests
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 python-dotenv pyinstaller
          if exist requirements.txt (
            echo Cleaning requirements.txt for Windows...
            findstr /V /I "pyobjc" requirements.txt > req_win.txt
            pip install -r req_win.txt
          )

      # THE ADDRESS BELOW HAS A TWIN in the macOS job, written in a different
      # shell. Both must say the same thing: if only one is changed, Windows
      # and Mac talk to different servers, and closing the plain port later
      # would break exactly one of them — with nothing to explain why.
      - name: Create client .env file
        run: |
          echo APP_NAME=Amaze Connect > client\.env
          echo SCREENSHOT_MIN_INTERVAL=300 >> client\.env
          echo SCREENSHOT_MAX_INTERVAL=600 >> client\.env
          echo IDLE_THRESHOLD=60 >> client\.env
          echo API_BASE_URL=https://connect.amazeinternet.com/api >> client\.env
          echo SCREENSHOT_ENCRYPTION_KEY=${{ secrets.SCREENSHOT_ENCRYPTION_KEY }} >> client\.env

      - name: Build Windows EXE
        run: |
          # Back to --onedir? No: reverted to --onefile on request.
          #
          # onefile extracts the ~62MB bundle to %TEMP% on every launch,
          # which is why startup was slow. onedir avoided that, but the
          # folder layout is a bigger change to how the app is distributed.
          #
          # --noupx: PyInstaller uses UPX to compress the binary when UPX
          # is on PATH. UPX-packed executables are one of the strongest
          # signals AV heuristics look for, because real malware uses the
          # same packer to hide its payload. Disabling it costs a few MB
          # and removes one concrete reason to flag us.
          #
          # NOTE: this reduces the false-positive rate but does not fix it.
          # An unsigned binary that screenshots the desktop and installs
          # itself at startup will keep tripping heuristics. The only real
          # fix is a code-signing certificate — see DEPLOYMENT.md.
          rem --onedir, NOT --onefile.
          rem
          rem onefile packs everything into one executable and extracts the
          rem lot — 62 MB of it — into a FRESH %TEMP% directory on every
          rem single launch. Defender then rescans all of it, because a new
          rem directory looks like new files, and while that happens the GIL
          rem is held and Windows paints the window as "Not Responding". The
          rem investigation is written up in client/main.py.
          rem
          rem The Mac build was moved to onedir for exactly this reason and
          rem the Windows one was left behind. With onedir the files live at
          rem a fixed install path, so Defender scans them once — at install
          rem — and never again.
          rem
          rem --noupx: PyInstaller compresses with UPX when it is on PATH.
          rem UPX-packed executables are one of the strongest signals AV
          rem heuristics look for, because real malware uses the same packer.
          pyinstaller --onedir --windowed --noupx --add-data "client/.env;." --add-data "assets;assets" --icon="assets/icon.ico" --name="Amaze Connect" client/main.py

      - name: Verify Windows build output
        shell: bash
        run: |
          # Catch a silently misplaced build here rather than after someone
          # downloads an empty artifact.
          test -f "dist/Amaze Connect/Amaze Connect.exe" || {
            echo "exe not found"; ls -R dist | head -40; exit 1; }
          echo "OK: dist/Amaze Connect/Amaze Connect.exe"
          du -sh "dist/Amaze Connect"

      - name: Build the installer
        shell: bash
        run: |
          # Inno Setup — free, and already installed on the GitHub Windows
          # runner. It turns the onedir folder into one Setup.exe that
          # installs to Program Files, adds a Start Menu entry, and
          # uninstalls cleanly: what somebody handing this to a company is
          # expected to provide, rather than a loose executable to copy.
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in v*|"") VERSION="0.0.0";; esac
          cat > installer.iss <<EOF
          [Setup]
          AppName=Amaze Connect
          AppVersion=$VERSION
          AppPublisher=Amaze Internet Services Pvt. Ltd.
          DefaultDirName={autopf}\\Amaze Connect
          DefaultGroupName=Amaze Connect
          UninstallDisplayIcon={app}\\Amaze Connect.exe
          OutputDir=installer_out
          OutputBaseFilename=Amaze-Connect-Setup
          Compression=lzma2
          SolidCompression=yes
          ; Per-user by default so no admin prompt is needed to install.
          PrivilegesRequired=lowest
          ArchitecturesInstallIn64BitMode=x64compatible

          [Files]
          Source: "dist\\Amaze Connect\\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs ignoreversion

          [Icons]
          Name: "{group}\\Amaze Connect"; Filename: "{app}\\Amaze Connect.exe"
          Name: "{userdesktop}\\Amaze Connect"; Filename: "{app}\\Amaze Connect.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional shortcuts:"

          [Registry]
          ; The app registers itself to start at login (StartupManager). The
          ; uninstaller has to take that entry away again, or Windows goes on
          ; trying to launch a deleted executable at every login for as long
          ; as the machine lives. ValueType none creates nothing at install —
          ; this line exists only for the uninstall side.
          Root: HKCU; Subkey: "Software\\Microsoft\\Windows\\CurrentVersion\\Run"; ValueType: none; ValueName: "ETS"; Flags: uninsdeletevalue

          [Run]
          Filename: "{app}\\Amaze Connect.exe"; Description: "Start Amaze Connect"; Flags: nowait postinstall skipifsilent
          EOF
          # Inno Setup ships on the GitHub Windows image, but the path has
          # moved between image versions and a hard-coded one fails the build
          # for a reason that has nothing to do with the code. Look for it,
          # and install it if this image does not have it.
          ISCC=""
          for candidate in \
            "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            "/c/Program Files/Inno Setup 6/ISCC.exe"; do
            [ -f "$candidate" ] && ISCC="$candidate" && break
          done
          if [ -z "$ISCC" ]; then
            echo "Inno Setup not on this image — installing"
            choco install innosetup -y --no-progress
            ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          fi
          echo "using $ISCC"
          "$ISCC" installer.iss
          ls -lh installer_out

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Installer
          path: installer_out/Amaze-Connect-Setup.exe

  build-mac:
    needs: tests
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Mac System Tools & Dependencies
        run: |
          brew install create-dmg
          python -m pip install --upgrade pip
          pip install PySide6 python-dotenv pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Create client .env file
        run: |
          echo "APP_NAME=Amaze Connect" > client/.env
          echo "SCREENSHOT_MIN_INTERVAL=300" >> client/.env
          echo "SCREENSHOT_MAX_INTERVAL=600" >> client/.env
          echo "IDLE_THRESHOLD=60" >> client/.env
          echo "API_BASE_URL=https://connect.amazeinternet.com/api" >> client/.env
          echo "SCREENSHOT_ENCRYPTION_KEY=${{ secrets.SCREENSHOT_ENCRYPTION_KEY }}" >> client/.env

      - name: Build Mac Executable
        run: |
          # --onedir (onefile nahi): onefile har launch pe poora 62MB bundle
          # temp folder me extract karta hai — isi wajah se app khulne me
          # kai second lagte the aur user ko 3-4 baar click karna padta tha.
          # onedir me libraries seedha .app/Contents/ me rehti hain, koi
          # extraction nahi. DMG me waise bhi .app hi jaata hai, is liye
          # distribution bilkul same rehta hai.
          # --osx-bundle-identifier: A FIXED IDENTITY, because macOS files the
          # Screen Recording permission under one.
          #
          # Without it PyInstaller invents an identifier from the app's name,
          # and macOS — for an app that is not signed — falls back to
          # identifying it by the hash of its binary. Both change from one
          # build to the next, so every installer arrived as a stranger: the
          # switch the person could see turned ON in System Settings belonged
          # to the build before it, while the one now running had never been
          # granted anything. That is the "toggle already ON, quit and reopen,
          # still no screenshots" report, and it is not a bug in the capture
          # code.
          #
          # THIS DOES NOT FINISH THE JOB. Until the app is signed with an
          # Apple Developer ID, macOS still keys the permission to the
          # binary's hash, so a new build asks again — once, on first launch,
          # and it holds for that build. Signing is the fix; this stops the
          # identity drifting for reasons of naming.
          pyinstaller --onedir --windowed --add-data "client/.env:." --add-data "assets:assets" --icon="assets/icon.icns" --osx-bundle-identifier "com.amazeinternet.amazeconnect" --name="Amaze Connect" client/main.py

      - name: Say what the screen capture is for
        run: |
          # Shown inside the system's own permission prompt. Without it macOS
          # asks for Screen Recording with no reason attached, which is what
          # people decline.
          #
          # Written here rather than in a .spec file: this workflow builds
          # from the pyinstaller command line above and never reads ETS.spec —
          # which is in .gitignore and exists only on a developer's machine.
          plutil -insert NSScreenCaptureUsageDescription \
            -string "Amaze Connect captures periodic screenshots of your work session while you are signed in, as configured by your administrator." \
            "dist/Amaze Connect.app/Contents/Info.plist"
          # THE VERSION THE SYSTEM SHOWS. PyInstaller writes 0.0.0 and never
          # asks the code, so Get Info and the About box said 0.0.0 on a
          # build called v1.0.1. Taken from the same constant the app reports
          # about itself, so the two cannot disagree.
          APP_VERSION="$(grep -oE 'APP_VERSION = "[^"]+"' client/core/config/__init__.py | cut -d'"' -f2)"
          plutil -replace CFBundleShortVersionString -string "$APP_VERSION" \
            "dist/Amaze Connect.app/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$APP_VERSION" \
            "dist/Amaze Connect.app/Contents/Info.plist"

          # RE-SIGN, BECAUSE EDITING Info.plist BROKE THE SIGNATURE.
          #
          # PyInstaller ad-hoc signs the bundle, and every plutil line above
          # modifies it afterwards. macOS then refuses the app outright:
          #
          #   invalid Info.plist (plist or signature have been modified)
          #
          # That is not a warning somebody can click past — it is a refusal,
          # and it was in the v1.0.1 build that shipped. Verified on the
          # downloaded DMG, not assumed.
          codesign --force --deep --sign - "dist/Amaze Connect.app"
          codesign --verify --deep --strict --verbose=2 "dist/Amaze Connect.app"
          plutil -p "dist/Amaze Connect.app/Contents/Info.plist" \
            | grep -E "BundleIdentifier|ScreenCapture|CFBundleShortVersion"

      - name: Create DMG Installer
        run: |
          mkdir dmg_out
          create-dmg \
            --volname "Amaze Connect" \
            --volicon "assets/icon.icns" \
            --window-size 500 300 \
            --icon-size 100 \
            --icon "Amaze Connect.app" 130 120 \
            --app-drop-link 350 120 \
            "dmg_out/Amaze-Connect.dmg" \
            "dist/Amaze Connect.app"

      - name: Upload Mac DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mac-DMG
          path: dmg_out/Amaze-Connect.dmg

  # ── the release ────────────────────────────────────────────────────────
  #  Runs only for a v* tag.
  #
  #  Until now the installers existed solely as workflow artifacts, which
  #  expire — so the download links on a release older than a few weeks were
  #  dead, and the last release had to be assembled by hand: download both
  #  artifacts, then upload them again to the release page. This does that
  #  part, so a tag is all it takes.
  # ── LINUX ─────────────────────────────────────────────────────────────
  #
  # Ek tarball, .deb nahi: is app ko install karne ki zaroorat nahi — folder
  # kholiye aur chalaiye. .deb banane ka matlab hai package metadata,
  # dependencies aur ek install step, jo abhi kisi ne maanga nahi.
  #
  # Qt ko Linux par kuch system libraries chahiye jo runner par pehle se
  # nahi hoti; wo neeche install ki jaati hain, warna build to ban jaati hai
  # par chalne par "could not load the Qt platform plugin xcb" deti hai.
  build-linux:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install the libraries Qt needs
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-shape0 libgl1 \
            python3-tk scrot
          # scrot aur python3-tk pyautogui ke liye: Linux par screenshot
          # wahi leta hai, aur wo in dono ke bina kaam nahi karta.
          python -m pip install --upgrade pip
          pip install PySide6 python-dotenv pyinstaller
          # requirements.txt EK MAC PAR `pip freeze` SE BANA HAI.
          #
          # Usme pyobjc hai, jo Linux par build hi nahi hota — "PyObjC
          # requires macOS to build", aur poora job wahin ruk jaata hai. Ye
          # pehli Linux build isi par giri.
          #
          # Windows job pehle se yahi karta hai (findstr /V /I "pyobjc"). Do
          # jagah ek hi cheez, do shell me — jaisa is file me pehle se hai.
          if [ -f requirements.txt ]; then
            grep -vi "pyobjc" requirements.txt > req_linux.txt
            pip install -r req_linux.txt
          fi

      - name: Create client .env file
        run: |
          echo "APP_NAME=Amaze Connect" > client/.env
          echo "SCREENSHOT_MIN_INTERVAL=300" >> client/.env
          echo "SCREENSHOT_MAX_INTERVAL=600" >> client/.env
          echo "IDLE_THRESHOLD=60" >> client/.env
          echo "API_BASE_URL=https://connect.amazeinternet.com/api" >> client/.env
          echo "SCREENSHOT_ENCRYPTION_KEY=${{ secrets.SCREENSHOT_ENCRYPTION_KEY }}" >> client/.env

      - name: Build Linux Executable
        run: |
          # --onedir, mac aur windows ki tarah — onefile har launch par poora
          # bundle temp me kholta hai, jo dheema hai aur har baar disk likhta.
          pyinstaller --onedir --windowed \
            --add-data "client/.env:." --add-data "assets:assets" \
            --name="AmazeConnect" client/main.py

      - name: Make it runnable, and say how
        run: |
          cd dist
          cat > AmazeConnect/README.txt <<'TXT'
          Amaze Connect — Linux

          Chalane ke liye:
              ./AmazeConnect/AmazeConnect

          Agar permission na ho:
              chmod +x AmazeConnect/AmazeConnect
          TXT
          chmod +x AmazeConnect/AmazeConnect
          tar czf AmazeConnect-linux-x86_64.tar.gz AmazeConnect
          ls -lh AmazeConnect-linux-x86_64.tar.gz

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Tarball
          path: dist/AmazeConnect-linux-x86_64.tar.gz

  release:
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download the installers
        uses: actions/download-artifact@v4
        with:
          path: installers

      - name: Name them after the version
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release
          # A file called "Setup.exe" on a release page tells nobody which
          # build it is. Somebody reporting a bug should be able to say so
          # from the filename alone.
          cp "installers/Windows-Installer/Amaze-Connect-Setup.exe" \
             "release/Amaze-Connect-${VERSION}-Windows-Setup.exe"
          cp "installers/Mac-DMG/Amaze-Connect.dmg" \
             "release/Amaze-Connect-${VERSION}-macOS.dmg"
          ls -lh release

      - name: Check the version in the tag matches the one in the code
        run: |
          set -e
          TAG="${GITHUB_REF_NAME#v}"
          CODE="$(grep -oE 'APP_VERSION = "[^"]+"' client/core/config/__init__.py | cut -d'"' -f2)"
          # Shipping a build that reports a different version from the one it
          # was released under makes every support conversation start with a
          # wrong answer.
          if [ "$TAG" != "$CODE" ]; then
            echo "Tag says $TAG, the client reports $CODE."
            echo "Update APP_VERSION in client/core/config/__init__.py, or retag."
            exit 1
          fi
          echo "Both say $TAG."

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
