# ═══════════════════════════════════════════════════════════════════════
#  Nginx reverse proxy for Amaze ETS.
#
#  Install:
#      sudo cp deploy/nginx-ets.conf /etc/nginx/sites-available/ets
#      sudo ln -sf /etc/nginx/sites-available/ets /etc/nginx/sites-enabled/ets
#      sudo nginx -t && sudo systemctl reload nginx
#
#  TLS (needs a DOMAIN — certbot will not issue for a bare IP):
#      sudo certbot --nginx -d ets.yourdomain.com
#  Certbot rewrites this file to add the 443 block and the redirect.
#
#  AFTER TLS: change API_BASE_URL in .github/workflows/build.yml to
#  https://ets.yourdomain.com/api and rebuild, otherwise distributed
#  clients keep talking plain HTTP and the certificate buys nothing.
# ═══════════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name ets.yourdomain.com;   # replace before use

    # Screenshot uploads are capped at 10MB by multer; allow a little more
    # so nginx returns a clear 413 rather than cutting the connection.
    client_max_body_size 12M;

    # Uploads from a lossy link can be slow. These must exceed the client's
    # own timeouts, otherwise nginx kills a transfer the client thinks is
    # still healthy — which is what produced the "Request aborted" errors.
    proxy_connect_timeout 15s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # Do not leak the nginx version to unauthenticated clients.
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # express-rate-limit keys the per-IP limiter on this header, so it
        # must be correct or one office would be counted as one client.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }

    location / { return 404; }
}
